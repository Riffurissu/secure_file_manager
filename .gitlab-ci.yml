# CI/CD конвейер FileManager.
# Все джобы выполняются в Docker-контейнерах. Секреты в файле не хранятся:
# при необходимости они задаются в переменных GitLab CI/CD или окружения раннера.

stages:
  - build
  - test
  - sast
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Кэш NuGet внутри каталога проекта, чтобы GitLab мог его сохранять между запусками
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  SOLUTION: "FileManager.sln"
  API_PROJECT: "FileManager.Api/FileManager.Api.csproj"
  TEST_PROJECT: "FileManager.Tests/FileManager.Tests.csproj"
  # Docker-in-Docker: клиент в джобе подключается к демону в сервисе docker:dind по TLS
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  IMAGE_TAG: "filemanager:$CI_COMMIT_SHORT_SHA"

# Общие настройки для джоб на .NET SDK
.dotnet_base:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key:
      files:
        - FileManager.Api/FileManager.Api.csproj
        - FileManager.Tests/FileManager.Tests.csproj
    paths:
      - .nuget/packages/
  before_script:
    - dotnet --info

build_app:
  extends: .dotnet_base
  stage: build
  script:
    - dotnet restore "$SOLUTION"
    - dotnet build "$SOLUTION" --configuration Release --no-restore
    - dotnet publish "$API_PROJECT" --configuration Release --no-restore --no-build --output publish
  artifacts:
    name: "publish-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/
    expire_in: 1 week

run_tests:
  extends: .dotnet_base
  stage: test
  script:
    - dotnet restore "$TEST_PROJECT"
    - >
      dotnet test "$TEST_PROJECT" --configuration Release --no-restore
      --results-directory TestResults
      --logger "junit;LogFilePath=test-results.xml"
      --collect:"XPlat Code Coverage"
  artifacts:
    when: always
    name: "tests-$CI_COMMIT_SHORT_SHA"
    paths:
      - TestResults/
    expire_in: 1 week
    reports:
      junit: TestResults/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: TestResults/**/coverage.cobertura.xml

# SAST: Semgrep. Джоба падает, если найдены правила уровня ERROR (соответствует High/Critical).
# Правила заданы явно, без --config auto: auto отправляет метрики и не воспроизводим.
security_scan:
  stage: sast
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - >
      semgrep scan
      --config p/csharp
      --config p/owasp-top-ten
      --severity ERROR
      --exclude bin --exclude obj --exclude publish --exclude TestResults --exclude .nuget
      --error
      --sarif --output semgrep.sarif
  artifacts:
    when: always
    name: "sast-$CI_COMMIT_SHORT_SHA"
    paths:
      - semgrep.sarif
    expire_in: 1 week

# Локальный деплой: сборка Docker-образа из Dockerfile и запуск с пробросом порта 8080.
# Контекст сборки передаётся архивом, потому что демон dind не видит рабочий каталог джобы.
local_deploy:
  stage: deploy
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  before_script:
    - apk add --no-cache curl
    - docker info > /dev/null
  script:
    - tar -C "$CI_PROJECT_DIR" -cf - . | docker build -t "$IMAGE_TAG" -
    - docker volume create fm-data
    - docker run -d --name fm-app -p 8080:8080 -v fm-data:/data "$IMAGE_TAG"
    # Smoke-проверка: сервис должен ответить на /health из сети dind
    - curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://docker:8080/health
    - docker logs fm-app
  after_script:
    - docker rm -f fm-app || true
